name: Deploy to GitHub Pages

# Publica la PWA en GitHub Pages usando "GitHub Actions" como fuente.
# Requisito único: en el repo, Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
#
# La app se sirve en https://<usuario>.github.io/MiGuantera/ ; el `base`
# de Vite ya está configurado a '/MiGuantera/'. Si renombras el repo,
# ajusta VITE_BASE abajo (con barras al inicio y al final).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /MiGuantera/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
